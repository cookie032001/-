class Character {

    constructor(name) {

        this.name = name;

        this.alive = true;

        this.role = "human";

        this.lastTalkDay = 0;

        this.location = "ロビー";

        this.yesterdayLocation = "";

        this.fakeYesterdayLocation = "";

        this.witnessTarget = null;

        this.witnessLocation = "";

        this.dialogueHistory = [];

        this.memo = { inspected: {} };

        this.signs = { eye:false, claw:false, fang:false, temp:false, tail:false };

        this.knownSigns = { eye:null, claw:null, fang:null, temp:null, tail:null };

    }

}

class Game {

    constructor() {

        this.day = 1;

        this.timeState = "昼";

        this.radioListenedToday = false;

        this.phoneUsedToday = false;

        this.hunterOrderGivenToday = false;

        this.hasExecutedToday = false;

        this.hasFoundAbnormalToday = false;

        this.maxDays = 7;

        this.shotLimit = 6;

        this.penaltyBonus = 0;

        this.investigationCount = 0;

        this.playerLocation = "管理人室";

        this.isGameOver = false;

        this.executionUnlocked = false;

        this.madmanAwakened = false;

        this.playerAwakened = false;

        this.hunterRevealed = false;

        this.hunterGuardTarget = null;

        this.secondVictimOccurred = false;

        this.eventPlaying = false;

        this.learnedSigns = { eye: false, claw: false, fang: false, temp: false, tail: false };

        this.characters = [

            new Character("あなた"),

            new Character("エマ"),

            new Character("エミリー"),

            new Character("イソップ"),

            new Character("オルフェウス"),

            new Character("ノートン"),

            new Character("トレイシー"),

            new Character("ウィリアム"),

            new Character("マーサ"),

            new Character("マイク"),

            new Character("パトリシア"),

            new Character("アンドルー")

        ];

        this.assignWolves();

        this.assignRoles();

        this.assignSigns();

    }

startNight() {

    this.timeState = "夜";

    updateUI();

    log("\n夜になった。");

    log("全員寝静まっているはずだ。");

    this.nightAttack();

    this.advanceDay();

}

    get maxInvestigationLimit() {

        return Math.max(1, 7 - (this.day - 1)) + this.penaltyBonus;

    }

    assignWolves() {

        const pool = this.characters.filter(c => c.name !== "あなた").sort(() => Math.random() - 0.5);

        for (let i = 0; i < 3; i++) { if(pool[i]) pool[i].role = "wolf"; }

    }

    assignRoles() {

        const hunterCandidates = ["ウィリアム", "マーサ"];

        const hunterName = hunterCandidates[Math.floor(Math.random() * hunterCandidates.length)];

        const hunter = this.characters.find(c => c.name === hunterName && c.role === "human");

        if(hunter) hunter.role = "hunter";

        const madmanPool = this.characters.filter(c => c.role === "human" && c.name !== "あなた" && c.role !== "hunter");

        if(madmanPool.length > 0) {

            const madman = madmanPool[Math.floor(Math.random() * madmanPool.length)];

            madman.role = "madman";

        }

    }

    assignSigns() {

        const signList = ["eye", "claw", "fang", "temp"];

        this.characters.forEach(c => {

            if(c.name === "あなた") {

                c.signs.eye = true;

                return;

            }

            if(c.role === "madman") return;

            if(c.role === "wolf") {

                const shuffled = [...signList].sort(() => Math.random() - 0.5);

                const count = 2 + Math.floor(Math.random() * 2);

                for(let i = 0; i < count; i++) { c.signs[shuffled[i]] = true; }

                return;

            }

            const abnormal = signList[Math.floor(Math.random() * signList.length)];

            c.signs[abnormal] = true;

        });

    }

    assignLocations() {

        this.characters.forEach(c => {

            if (c.name !== "あなた") {

                const commonLocs = [

    "ロビー",

    "食堂",

    "暖炉前",

    "図書室",

    "展望テラス",

    "ボイラー室",

    "倉庫"

];

                c.location = commonLocs[Math.floor(Math.random() * commonLocs.length)];

                c.yesterdayLocation = commonLocs[Math.floor(Math.random() * commonLocs.length)];

            }

        });

        this.enforceLocationLimits();

    }

    enforceLocationLimits() {

        const locations = [

    "ロビー",

    "食堂",

    "暖炉前",

    "図書室",

    "展望テラス",

    "ボイラー室",

    "倉庫"

];

        let changed = true;

        while(changed) {

            changed = false;

            for(const loc of locations) {

                let people = this.characters.filter(c => c.alive && c.name !== "あなた" && c.location === loc);

                while(people.length > 3) {

                    const moved = people.pop();

                    const available = locations.filter(l => this.characters.filter(c => c.alive && c.name !== "あなた" && c.location === l).length < 3);

                    if(available.length === 0) break;

                    moved.location = available[Math.floor(Math.random() * available.length)];

                    changed = true;

                }

            }

        }

    }

    generateAlibisAndWitnesses() {

        const commonLocs = [

    "ロビー",

    "食堂",

    "暖炉前",

    "図書室",

    "展望テラス",

    "ボイラー室",

    "倉庫"

];

        const aliveOthers = this.characters.filter(c => c.name !== "あなた" && c.alive);

        aliveOthers.forEach(c => {

            if (c.role === "wolf") {

                const otherLocs = commonLocs.filter(l => l !== c.yesterdayLocation);

                c.fakeYesterdayLocation = otherLocs[Math.floor(Math.random() * otherLocs.length)];

                const targets = aliveOthers.filter(t => t !== c);

                if (targets.length > 0) {

                    const victim = targets[Math.floor(Math.random() * targets.length)];

                    c.witnessTarget = victim.name;

                    c.witnessLocation = commonLocs[Math.floor(Math.random() * commonLocs.length)];

                } else {

                    c.witnessTarget = null;

                    c.witnessLocation = "";

                }

            } else {

                c.fakeYesterdayLocation = c.yesterdayLocation;

                const targets = aliveOthers.filter(t => t !== c);

                if (targets.length > 0) {

                    const seen = targets[Math.floor(Math.random() * targets.length)];

                    c.witnessTarget = seen.name;

                    c.witnessLocation = seen.yesterdayLocation;

                } else {

                    c.witnessTarget = null;

                    c.witnessLocation = "";

                }

            }

        });

    }

    getAlive() { return this.characters.filter(c => c.alive); }

    getAliveWolves() { return this.characters.filter(c => c.alive && c.role === "wolf"); }

    getAliveHumans() {

        return this.characters.filter(c => c.alive && c.name !== "あなた" && c.role !== "wolf" && !(c.role === "madman" && this.madmanAwakened));

    }

    getCharactersAtLocation(loc) { return this.getAlive().filter(c => c.name !== "あなた" && c.location === loc); }

    movePlayer(loc) {

        this.playerLocation = loc;

        const present = this.getCharactersAtLocation(loc);

        let msg = `\n「${loc}」へ移動した。`;

        if (loc !== "管理人室") {

            if (present.length > 0) {

                const names = present.map(p => p.name).join("、");

                msg += `そこには ${names} がいた。`;

            } else {

                msg += `そこには誰もいなかった。`;

            }

        }

        log(msg);

        saveGame();

        updateUI();

    }

    investigate(character, signType) {

        if (this.isGameOver) return;

        if (this.investigationCount >= this.maxInvestigationLimit) { log("\n>> 本日の調査限界に達した。"); return; }

        this.investigationCount++;

        const limit = this.maxInvestigationLimit;

        if (limit - this.investigationCount === 1) {

            log("\n⚠️【警告】本日の調査上限まで残り1回です！");

        }

        const labels = { eye:"眼", claw:"爪", fang:"牙", temp:"体温", tail:"尻尾" };

        let preInspectText = "";

        if (character.name === "あなた") {

            preInspectText = "鏡に自分の姿を映した。";

        } else if (CHARACTER_DIALOGUES[character.name]) {

            preInspectText = CHARACTER_DIALOGUES[character.name].inspect;

        } else {

            preInspectText = `${character.name}「なんだよ、人の顔ばかりジロジロ見やがって……」`;

        }

        const isAbnormal = character.signs[signType];

        character.knownSigns[signType] = isAbnormal;

        character.memo.inspected[signType] = true;

        const inspectResultText = isAbnormal ? `【調査：${labels[signType]}】⇒ 異常反応を発見！` : `【調査：${labels[signType]}】⇒ 異常なし。`;

        addHistory(character, inspectResultText);

        if (isAbnormal) {

    if(character.name === "あなた"){

        log("⇒ くそ、眼が赤い・・・");

        saveGame();

        updateUI();

        return;

    }

    playSE("found");

    log("⇒ 【異常反応を発見した！】\n");

    log(`【警告】${character.name}に異常反応を検出。処刑するか、見逃すか選択してください。`);

    this.hasFoundAbnormalToday = true;

    saveGame();

    updateUI();

    showAbnormalFoundMenu(character);

    return;

}

   else {

            log("⇒ 特に異常はないようだ。");

        }

        saveGame();

        updateUI();

    }

    execution(target) {

        if (this.hasExecutedToday) return;

        if(this.hunterGuardTarget === target.name) {

            const hunter = this.characters.find(c => c.role === "hunter" && c.alive);

            if(hunter) {

                log("");

                if(hunter.name === "ウィリアム") {

                    log("ウィリアム『おいおい！護衛対象に指定した奴を撃っちまうなんてどういうつもりだ！？再指示をくれ！』");

                } else {

                    log("マーサ『護衛任務を与えた相手を射殺するなんて……！指示をやり直しなさい！』");

                }

            }

            this.hunterGuardTarget = null;

            this.hunterOrderGivenToday = false;

        }

        target.alive = false;

        this.shotLimit--;

        this.hasExecutedToday = true;

        this.hasFoundAbnormalToday = false;

        let deathCry = CHARACTER_DIALOGUES[target.name] ? CHARACTER_DIALOGUES[target.name].execution : `${target.name}「や、やめろ！助けてくれ！！」`;

        playSE("gun");

        log(`\n${deathCry}\nあなたは猟銃を構えた。……バァン！！\n${target.name}は崩れ落ちた。\n`);

        if(target.role === "wolf") {

            log("突然身体が膨れ上がる。骨が軋み、毛皮が全身を覆った。それは紛れもなく――【人狼】だった。");

        } else {

            log("そこに倒れていたのはただの人間だった。あなたは言葉を失った。");

        }

        saveGame();

        this.checkWinCondition();

        updateUI();

    }

    nightAttack() {

        const victims = this.characters.filter(c => c.alive && c.name !== "あなた" && c.role !== "wolf" && c.role !== "hunter" && !(c.role === "madman" && this.day <= 2));

        if(victims.length === 0) return;

        const target = victims[Math.floor(Math.random() * victims.length)];

        if(target.role === "madman" && !this.madmanAwakened) {

    this.madmanAwakened = true;

    // 狂人を人狼化

    target.role = "wolf";

    log("\n【夜の異変】");

    log("どこかで狼の遠吠えが聞こえた。");

    log("だが不気味なほどに静かだ……今朝は誰も死亡していない。");

    log("");

    this.checkWinCondition();

    return;

}

        if(this.hunterGuardTarget === target.name) {

            const hunter = this.characters.find(c => c.role === "hunter" && c.alive);

            if(hunter) {

                hunter.alive = false;

                log(`\n【夜の悲劇】\n${hunter.name}が${target.name}をかばって死亡した。\n`);

                this.hunterGuardTarget = null;

                return;

            }

        }

        target.alive = false;

playSE("howl");

setTimeout(() => {

    log(`\n今朝、${target.name}が無残な姿で発見された……。`);

}, 2500);

this.hunterGuardTarget = null;

this.checkWinCondition();

}

    revealAllRoles() {

        const roleLabels = {

            wolf: "人狼",

            madman: "狂人",

            hunter: "狩人",

            human: "市民"

        };

        const rolePriority = {

            wolf: 1,

            madman: 2,

            hunter: 3,

            human: 4

        };

        log("\n========== 【全役職公開】 ==========");

        // 優先度順（人狼、狂人、狩人、市民）にソートして表示

        const sortedList = [...this.characters]

            .filter(c => c.name !== "あなた")

            .sort((a, b) => (rolePriority[a.role] || 99) - (rolePriority[b.role] || 99));

        sortedList.forEach(c => {

            const status = c.alive ? "生存" : "死亡";

            log(`・${c.name} ⇒ ${roleLabels[c.role] || c.role}（${status}）`);

        });

        log("====================================\n");

    }

    checkWinCondition() {

        const wolves = this.getAliveWolves();

        const humans = this.getAliveHumans();

        if (wolves.length === 0) {

            this.isGameOver = true;

            log("\n=================\n【エンディング：人間の勝利】\n全ての人狼を排除した！\n=================");

            this.revealAllRoles();

            clearSaveData();

            showGameOverControls();

            return true;

        }

        const madmanAlive = this.characters.some(c => c.alive && c.role === "madman" && this.madmanAwakened);

        const evilCount = wolves.length + (madmanAlive ? 1 : 0);

        if(evilCount >= humans.length) {

            this.isGameOver = true;

            log("\n=================\n【エンディング：人狼の勝利】\n生存する人間が人狼以下になった……。\n=================");

            this.revealAllRoles();

            clearSaveData();

            showGameOverControls();

            return true;

        }

        return false;

    }

    advanceDay() {

if (

    this.day === 1 &&

    !this.phoneUsedToday

) {

    log("\n📞救助要請しておこう。");

    return;

}

    if (this.isGameOver) return;

    this.day++;

        if(this.day === 3) {

            const hunter = this.characters.find(c => c.role === "hunter" && c.alive);

            if(hunter && !this.hunterRevealed) {

                this.hunterRevealed = true;

                if(hunter.name === "ウィリアム") {

                    log("\nウィリアム『俺はハンター（狩人）だ！今夜守るターゲットを指定してくれ！』\n");

                } else {

function playHowlSound() {

    try {

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = audioCtx.createOscillator();

        const gainNode = audioCtx.createGain();

        osc.type = 'sine';

        const now = audioCtx.currentTime;

        osc.frequency.setValueAtTime(400, now);

        osc.frequency.exponentialRampToValueAtTime(180, now + 1.2);

        osc.frequency.exponentialRampToValueAtTime(260, now + 2.5);

        gainNode.gain.setValueAtTime(0.01, now);

        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.5);

        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

        osc.connect(gainNode);

        gainNode.connect(audioCtx.destination);

        osc.start(now);

        osc.stop(now + 2.8);

    } catch(e) {}

}

function playGunshotSound() {

    try {

        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();

        const gain = ctx.createGain();

        osc.type = "square";

        osc.frequency.setValueAtTime(80, ctx.currentTime);

        gain.gain.setValueAtTime(1, ctx.currentTime);

        gain.gain.exponentialRampToValueAtTime(

            0.001,

            ctx.currentTime + 0.15

        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(ctx.currentTime + 0.15);

    } catch(e){}

}

function showMemo() {

    log("\n========== 調査メモ ==========");

    const labels = { eye:"眼", claw:"爪", fang:"牙", temp:"体温", tail:"尻尾" };

    // 死亡した人物の調査記録を消去

    game.characters.forEach(c => {

        if (!c.alive) {

            c.knownSigns = { eye: null, claw: null, fang: null, temp: null, tail: null };

            c.memo.inspected = {};

        }

    });

    let found = false;

    game.characters.forEach(c => {

        if(c.name === "あなた" || !c.alive) return;

        let results = [];

        Object.keys(c.knownSigns).forEach(key => {
            if(c.knownSigns[key] !== null) {
                results.push(`${labels[key]}:${c.knownSigns[key] ? "異常あり" : "異常なし"}`);
            }
        });
        if(results.length > 0) {
            found = true;
            log(`・${c.name} → ${results.join(" / ")}`);
        }
    });
    if(!found) log("（調査記録なし）");
    const alive = game.characters.filter(c => c.alive && c.name !== "あなた").map(c => c.name);
    log(`\n【生存者】(${alive.length}名)\n${alive.length === 0 ? "なし" : alive.join("、")}`);
    const dead = game.characters.filter(c => !c.alive && c.name !== "あなた").map(c => {
        const side = (c.role === "wolf") ? "人狼" : "市民";
        return `${c.name}（${side}）`;
    });
    log(`\n【死亡者】(${dead.length}名)\n${dead.length === 0 ? "なし" : dead.join("、")}`);
    if(game.hunterGuardTarget) log(`\n【護衛情報】\n現在の護衛対象：${game.hunterGuardTarget}`);
    log("============================\n");
}
